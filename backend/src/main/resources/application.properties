spring.application.name=presencepair

# Base H2 embarquée dans un fichier : rien à installer chez le correcteur (ENF6)
spring.datasource.url=jdbc:h2:file:./data/presencepair;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Schéma versionné par Flyway (B5) ; Hibernate vérifie seulement qu'il correspond aux entités
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Jamais de stack trace ni de message interne dans une réponse (B4)
server.error.include-stacktrace=never
server.error.include-message=never

# RG9 : une note 12.5 doit être refusée (400 NOTE_INVALIDE), pas tronquée en 12
spring.jackson.deserialization.accept-float-as-int=false
